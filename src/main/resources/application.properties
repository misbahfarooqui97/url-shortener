spring.application.name=urlshortener

server.port=${SERVER_PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Caches the code -> ShortUrl lookup used by the redirect and analytics endpoints
# (see CachedShortUrlLookup). Only successful lookups are cached; a short-lived TTL
# bounds staleness if a link is ever deactivated (see docs/engineering-summary.md).
spring.cache.cache-names=shortUrlsByCode
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=30s

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:urlshortener;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
